services:
  db:
    image: postgres:17
    env_file:
      - .env
    volumes:
      - pgdata_new:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh /app/entrypoint.sh python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./code:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
    environment:
      PORT: 3000
      API_BASE_URL: http://web:8000
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      - web

  pgadminjuice:
    image: dpage/pgadmin4
    container_name: pgadminjuice
    restart: always
    env_file:
      - .env
    ports:
      - "5051:80"
    depends_on:
      - db

volumes:
  pgdata_new:
