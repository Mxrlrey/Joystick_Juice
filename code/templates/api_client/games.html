{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Jogos API Client</title>
    <link rel="stylesheet" href="{% static 'css/api_client/client.css' %}">
</head>
<body>
    <main class="page">
        <nav class="topbar">
            <a class="brand" href="/client/">API Client</a>
            <div class="nav-links">
                <a href="/client/">Login</a>
                <a href="/client/games/">Listar</a>
                <a href="/client/games/form/">Adicionar</a>
            </div>
        </nav>

        <section class="panel">
            <div class="section-title">
                <div>
                    <h1>Jogos da API</h1>
                    <p class="muted">Listagem consumindo a rota protegida <code>/api/games/</code>.</p>
                </div>
                <span id="token-status" class="status offline">Sem token</span>
            </div>

            <div class="button-row">
                <button id="refresh-games" type="button">Atualizar</button>
                <a class="button secondary" href="/client/games/form/">Adicionar jogo</a>
                <button id="clear-token" type="button" class="secondary">Limpar token</button>
            </div>

            <p id="message" class="message"></p>
            <div id="games" class="games"></div>
        </section>
    </main>

    <script src="{% static 'js/api_client/common.js' %}"></script>
    <script src="{% static 'js/api_client/games.js' %}"></script>
</body>
</html>
