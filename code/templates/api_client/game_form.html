{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Jogo API Client</title>
    <link rel="stylesheet" href="{% static 'css/api_client/client.css' %}">
</head>
<body>
    <main class="page">
        <nav class="topbar">
            <a class="brand" href="/client/">API Client</a>
            <div class="nav-links">
                <a href="/client/">Login</a>
                <a href="/client/games/">Listar</a>
                <a href="/client/games/form/">Adicionar</a>
            </div>
        </nav>

        <section class="panel">
            <div class="section-title">
                <div>
                    <h1 id="form-title">Adicionar jogo</h1>
                    <p class="muted">Crie ou edite registros usando o CRUD de <code>/api/games/</code>.</p>
                </div>
                <span id="token-status" class="status offline">Sem token</span>
            </div>

            <form id="game-form" class="game-form">
                <input id="game-id" type="hidden">
                <label>
                    Titulo
                    <input id="title" required>
                </label>
                <label>
                    Genero
                    <input id="genre" required>
                </label>
                <label>
                    Lancamento
                    <input id="release-date" type="date" required>
                </label>
                <label>
                    Desenvolvedora
                    <input id="developer" required>
                </label>
                <label class="wide">
                    Sinopse
                    <textarea id="synopsis" rows="5" required></textarea>
                </label>
                <label>
                    Capa URL
                    <input id="cover-url" type="url">
                </label>
                <label>
                    Banner URL
                    <input id="banner-url" type="url">
                </label>
                <label class="wide">
                    Trailer URL
                    <input id="trailer-url" type="url">
                </label>
                <div class="button-row wide">
                    <button type="submit">Salvar via API</button>
                    <a class="button secondary" href="/client/games/">Voltar para listagem</a>
                    <button id="clear-form" type="button" class="secondary">Limpar</button>
                </div>
            </form>

            <p id="message" class="message"></p>
        </section>
    </main>

    <script src="{% static 'js/api_client/common.js' %}"></script>
    <script src="{% static 'js/api_client/game_form.js' %}"></script>
</body>
</html>
