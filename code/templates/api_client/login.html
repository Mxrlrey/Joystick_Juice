{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login API Client</title>
    <link rel="stylesheet" href="{% static 'css/api_client/client.css' %}">
</head>
<body>
    <main class="page page-narrow">
        <nav class="topbar">
            <a class="brand" href="/client/">API Client</a>
            <div class="nav-links">
                <a href="/client/">Login</a>
                <a href="/client/games/">Listar</a>
                <a href="/client/games/form/">Adicionar</a>
            </div>
        </nav>

        <section class="panel">
            <div class="section-title">
                <div>
                    <h1>Login OAuth2</h1>
                    <p class="muted">Obtenha o token para acessar rotas protegidas.</p>
                </div>
                <span id="token-status" class="status offline">Sem token</span>
            </div>

            <form id="login-form" class="login-form">
                <label>
                    Usuario
                    <input id="username" name="username" autocomplete="username" value="admin" required>
                </label>
                <label>
                    Senha
                    <input id="password" name="password" type="password" autocomplete="current-password" value="admin123" required>
                </label>
                <button type="submit">Entrar e obter token</button>
            </form>

            <div class="button-row">
                <a class="button secondary" href="/client/games/">Ir para listagem</a>
                <button id="clear-token" type="button" class="secondary">Limpar token</button>
            </div>

            <p id="message" class="message"></p>
        </section>
    </main>

    <script src="{% static 'js/api_client/common.js' %}"></script>
    <script src="{% static 'js/api_client/login.js' %}"></script>
</body>
</html>
